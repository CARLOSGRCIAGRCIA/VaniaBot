name: vaniabot

services:
  vania-redis:
    image: redis:7-alpine
    container_name: vania-redis
    restart: always
    networks:
      - vania-network
    volumes:
      - vania-redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  vaniabot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: vaniabot
    restart: always
    user: '1001:1001'

    stdin_open: true
    tty: true

    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - TZ=America/Mexico_City
      - AUTH_MODE=${AUTH_MODE:-qr}
      - DOCKER_MODE=true
      - USE_REDIS=true
      - REDIS_HOST=vania-redis
      - REDIS_PORT=6379
      - SESSION_PATH=/app/vaniasession
      - NODE_OPTIONS=--max-old-space-size=512

    depends_on:
      vania-redis:
        condition: service_healthy

    networks:
      - vania-network

    volumes:
      - vaniabot_session:/app/vaniasession
      - vaniabot_subbots:/app/data/subbot-sessions
      - vaniabot_database:/app/data
      - vaniabot_temp:/app/data/temp

    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'

    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '10'

    stop_signal: SIGTERM
    stop_grace_period: 30s

networks:
  vania-network:
    driver: bridge

volumes:
  vaniabot_session:
    name: vaniabot_session
    driver: local

  vaniabot_subbots:
    name: vaniabot_subbots
    driver: local

  vaniabot_database:
    name: vaniabot_database
    driver: local

  vaniabot_temp:
    name: vaniabot_temp
    driver: local

  vania-redis-data:
    name: vania-redis-data
    driver: local
