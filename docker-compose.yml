name: vaniabot

services:
  vania-redis:
    image: redis:7-alpine
    container_name: vania-redis
    restart: unless-stopped
    networks:
      - vania-network
    volumes:
      - vania-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  vaniabot:
    image: ghcr.io/carlosgrciagrcia/vaniabot:v6.12.2
    container_name: vaniabot
    restart: unless-stopped

    stdin_open: true
    tty: true

    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - TZ=America/Mexico_City
      - AUTH_MODE=${AUTH_MODE:-qr}
      - DOCKER_MODE=true
      - USE_REDIS=true
      - REDIS_HOST=vania-redis
      - REDIS_PORT=6379
      - SESSION_PATH=/app/vaniasession

    depends_on:
      vania-redis:
        condition: service_healthy

    networks:
      - vania-network

    volumes:
      - vaniabot_session:/app/vaniasession
      - vaniabot_subbots:/app/data/subbot-sessions
      - vaniabot_database:/app/data
      - vaniabot_temp:/app/data/temp

    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'
        reservations:
          memory: 256M
          cpus: '0.5'

    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'tsx vania.ts']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

    stop_signal: SIGTERM
    stop_grace_period: 15s

networks:
  vania-network:
    driver: bridge

volumes:
  vaniabot_session:
    name: vaniabot_session
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./vaniasession

  vaniabot_subbots:
    name: vaniabot_subbots
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./subbots

  vaniabot_database:
    name: vaniabot_database
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data

  vaniabot_temp:
    name: vaniabot_temp
    driver: local

  vania-redis-data:
    name: vania-redis-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./redis-data
