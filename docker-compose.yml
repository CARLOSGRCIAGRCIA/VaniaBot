name: vaniabot

services:
  vania-redis:
    image: redis:7-alpine
    container_name: vania-redis
    restart: unless-stopped
    networks:
      - vania-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  vaniabot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner

    container_name: vaniabot

    restart: unless-stopped

    stdin_open: true
    tty: true

    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - TZ=America/Mexico_City
      - AUTH_MODE=${AUTH_MODE:-qr}
      - DOCKER_MODE=true
      - USE_REDIS=true
      - REDIS_HOST=vania-redis
      - REDIS_PORT=6379

    depends_on:
      vania-redis:
        condition: service_healthy

    networks:
      - vania-network

    volumes:
      - vaniabot_session:/app/vaniasession
      - vaniabot_temp:/app/data/temp
      - ./data/assets:/app/data/assets:ro

    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'
        reservations:
          memory: 256M
          cpus: '0.5'

    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'tsx vania.ts']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

    stop_signal: SIGTERM
    stop_grace_period: 15s

networks:
  vania-network:
    external: true

volumes:
  vaniabot_session:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./vaniasession
    labels:
      description: 'Baileys WhatsApp session credentials'

  vaniabot_temp:
    driver: local
    labels:
      description: 'Temporary files for media downloads'
